name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      # The tasks run with --cached-only: fill the cache from deno.lock first.
      - run: deno install --frozen
      - run: deno task check
      - run: deno lint
      - run: deno fmt --check
      # The Toolkit test (deno task test:toolkit) needs an Assembly checkout
      # and is run locally; deno task test leaves it out.
      - run: deno task test
      - run: deno task plugin:build
