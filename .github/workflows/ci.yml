name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      # The tasks run with --cached-only: fill the cache from deno.lock first.
      - run: deno install --frozen
      - run: deno task check
      - run: deno lint
      - run: deno fmt --check
      - run: deno task test
      - name: Download and verify pinned Toolkit (bundled by plugin:build)
        shell: bash
        run: |
          archive="$RUNNER_TEMP/sysml-wasm-0.10.10.tgz"
          curl --fail --location --output "$archive" https://github.com/Open-MBEE/sysml-toolkit/releases/download/v0.10.10/sysml-wasm-0.10.10.tgz
          echo "93d6ef0a2140fceabc3115cd95d629146bc004c3959bfa23d715cce8b06cc13c  $archive" | sha256sum -c -
          echo "SYSML_TOOLKIT_WASM_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - run: deno task plugin:package
      - run: deno task test:toolkit
      - name: Download and verify pinned OpenSysML oracle
        shell: bash
        run: |
          archive="$RUNNER_TEMP/sysml-linux-amd64-0.11.0.tar.gz"
          curl --fail --location --output "$archive" https://github.com/Open-MBEE/OpenSysML/releases/download/v0.11.0/sysml-linux-amd64.tar.gz
          echo "4a7e8f8b59fd9d839cd364b275b73a5d68a6c4ae3e5adf039c9f1d846a6b5b9d  $archive" | sha256sum -c -
          echo "OPENSYSML_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - run: deno task test:opensysml
